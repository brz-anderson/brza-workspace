<!-- Navegador: janela de largura livre (375, 768 ou 1280), abas e barra de endereço; a altura é a do conteúdo. -->
<style>
.sa-browser { border-radius: 10px; overflow: hidden; background: var(--sa-background);
  box-shadow: 0 0 0 1px rgba(0,0,0,.22), 0 16px 36px -8px rgba(0,0,0,.32), 0 2px 6px rgba(0,0,0,.16); }
.sa-browser .sa-tabs { height: 36px; display: flex; align-items: flex-end; gap: 10px; padding: 0 12px 0 12px;
  background: var(--sa-muted); }
.sa-browser .sa-lights { display: flex; gap: 7px; align-self: center; flex: none; }
.sa-browser .sa-lights i { width: 11px; height: 11px; border-radius: 50%; display: block; background: var(--sa-border);
  box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); }
.sa-browser .sa-tab { height: 28px; min-width: 0; max-width: 220px; flex: 0 1 200px; display: flex; align-items: center;
  gap: 7px; padding: 0 12px; border-radius: 8px 8px 0 0; background: var(--sa-background); font-size: 12px;
  color: var(--sa-foreground); }
.sa-browser .sa-tab i { width: 12px; height: 12px; border-radius: 3px; background: var(--sa-primary); flex: none; }
.sa-browser .sa-tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sa-browser .sa-plus { align-self: center; color: var(--sa-muted-foreground); font-size: 16px; line-height: 1; }
.sa-browser .sa-tool { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--sa-background); border-bottom: 1px solid var(--sa-border); }
.sa-browser .sa-tool svg { width: 16px; height: 16px; flex: none; stroke: var(--sa-muted-foreground); fill: none;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sa-browser .sa-url { flex: 1 1 auto; min-width: 0; height: 26px; display: flex; align-items: center; gap: 7px;
  padding: 0 12px; border-radius: 13px; background: var(--sa-muted); font-size: 12px; color: var(--sa-muted-foreground); }
.sa-browser .sa-url svg { width: 12px; height: 12px; }
.sa-browser .sa-url span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sa-browser .sa-screen { min-height: 360px; }
</style>
<div class="sa-frame sa-browser" data-w="{{W}}" style="width:{{W}}px">
  <div class="sa-tabs">
    <span class="sa-lights"><i></i><i></i><i></i></span>
    <div class="sa-tab"><i></i><span>{{TITLE}}</span></div>
    <span class="sa-plus">+</span>
  </div>
  <div class="sa-tool">
    <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>
    <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
    <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.500-3.500M13 2.500v3h-3"/></svg>
    <div class="sa-url"><svg viewBox="0 0 12 12"><rect x="2" y="5.500" width="8" height="5.500" rx="1"/><path d="M4 5.500V4a2 2 0 0 1 4 0v1.500"/></svg><span>{{URL}}</span></div>
  </div>
  <div class="sa-screen"{{SCREENSTYLE}}>{{SCREEN}}</div>
</div>
