<!-- Android: tela de 412 x 915, corpo arredondado, câmera em furo, barra de status e barra de gestos. -->
<style>
.sa-android { padding: 10px; border-radius: 46px; background: #101114;
  box-shadow: 0 0 0 2px #34363b, 0 0 0 3.5px #121214, 0 22px 44px -10px rgba(0,0,0,.45); }
.sa-android .sa-dev { border-radius: 36px; overflow: hidden; position: relative; display: flex; flex-direction: column;
  background: var(--sa-m-bg-base, var(--sa-background)); }
.sa-android .sa-status { height: 38px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; font: 500 14px/1 Roboto, system-ui, sans-serif; color: var(--sa-foreground); position: relative; }
.sa-android .sa-status .sa-sys { display: flex; gap: 6px; align-items: center; }
.sa-android .sa-status svg { height: 12px; width: auto; fill: currentColor; display: block; }
.sa-android .sa-cam { position: absolute; top: 12px; left: 50%; width: 14px; height: 14px; margin-left: -7px;
  border-radius: 50%; background: #000; box-shadow: 0 0 0 2px rgba(128,128,128,.25); z-index: 3; }
.sa-android .sa-screen { flex: 1 1 auto; min-height: 0; position: relative; }
.sa-android .sa-gesture { height: 26px; flex: none; position: relative; }
.sa-android .sa-gesture::after { content: ''; position: absolute; left: 50%; bottom: 9px; width: 108px; height: 4px;
  margin-left: -54px; border-radius: 2px; background: var(--sa-foreground); opacity: .85; }
</style>
<div class="sa-frame sa-android" data-w="{{OUTERW}}" style="width:{{OUTERW}}px">
  <div class="sa-dev" style="width:{{W}}px;height:{{H}}px">
    <div class="sa-cam"></div>
    <div class="sa-status">
      <span>9:30</span>
      <span class="sa-sys">
        <svg viewBox="0 0 16 12"><path d="M8 2.200c2.200 0 4.200.9 5.700 2.300L15 3.200A10 10 0 0 0 8 .4 10 10 0 0 0 1 3.200l1.300 1.300A8.200 8.200 0 0 1 8 2.200zM8 6c1.200 0 2.300.5 3.100 1.200l1.300-1.300a6.400 6.400 0 0 0-8.800 0l1.300 1.300C5.700 6.500 6.800 6 8 6zm0 3.800L10 8a3.400 3.400 0 0 0-4 0z"/></svg>
        <svg viewBox="0 0 12 12"><path d="M12 12V0L0 12z"/></svg>
        <svg viewBox="0 0 10 12"><path d="M3 0h4v1.500h1.500a.5.5 0 0 1 .5.5v9.500a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5H3z"/></svg>
      </span>
    </div>
    <div class="sa-screen">{{SCREEN}}</div>
    <div class="sa-gesture"></div>
  </div>
</div>
